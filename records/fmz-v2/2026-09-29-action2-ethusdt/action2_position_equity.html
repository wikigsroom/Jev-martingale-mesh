    const parseDate = d3.utcParse('%Y-%m-%d');
    data.forEach(d => d.x = parseDate(d.d));
    const eventRows = data.filter(d => d.f > 0);

    function drawChart(selector, config) {
      const host = root.querySelector(selector);
      host.innerHTML = '';
      const width = Math.max(320, host.clientWidth || 736);
      const height = config.height || 240;
      const margin = { top: 16, right: 18, bottom: 36, left: 58 };
      const innerW = width - margin.left - margin.right;
      const innerH = height - margin.top - margin.bottom;
      const svg = d3.select(host).append('svg')
        .attr('viewBox', `0 0 ${width} ${height}`)
        .attr('role', 'img')
        .attr('aria-label', config.aria);
      svg.append('title').text(config.title);
      svg.append('desc').text(config.desc);
      const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
      const x = d3.scaleUtc().domain(d3.extent(data, d => d.x)).range([0, innerW]);
      const y = d3.scaleLinear().domain(config.domain).nice().range([innerH, 0]);
      const xAxis = d3.axisBottom(x).ticks(width < 520 ? 4 : 7).tickFormat(d3.utcFormat('%Y-%m'));
      const yAxis = d3.axisLeft(y).ticks(5).tickFormat(config.yFormat || (v => v));
      g.append('g').attr('class','grid').call(d3.axisLeft(y).ticks(5).tickSize(-innerW).tickFormat(''));
      g.append('g').attr('class','axis').attr('transform', `translate(0,${innerH})`).call(xAxis);
      g.append('g').attr('class','axis').call(yAxis);
      g.append('text').attr('class','axis-title').attr('data-axis','x').attr('x', innerW).attr('y', innerH + 32).attr('text-anchor','end').text('UTC 日期');
      g.append('text').attr('class','axis-title').attr('data-axis','y').attr('transform','rotate(-90)').attr('x', -8).attr('y', -44).attr('text-anchor','end').text(config.yTitle);
      if (config.reference !== undefined) {
        g.append('line').attr('x1',0).attr('x2',innerW).attr('y1',y(config.reference)).attr('y2',y(config.reference)).attr('stroke','var(--border)').attr('stroke-dasharray','3 3');
      }
      if (config.eventLines) {
        g.selectAll('.event-line').data(eventRows).join('line').attr('class','event-line')
          .attr('x1',d=>x(d.x)).attr('x2',d=>x(d.x)).attr('y1',0).attr('y2',innerH);
      }
      config.series.forEach(series => {
        const line = d3.line().x(d => x(d.x)).y(d => y(d[series.key])).curve(d3.curveMonotoneX);
        g.append('path').datum(data).attr('fill','none').attr('stroke',series.color).attr('stroke-width',series.width || 1.8).attr('d',line);
        if (series.area) {
          const area = d3.area().x(d=>x(d.x)).y0(y(0)).y1(d=>y(d[series.key])).curve(d3.curveMonotoneX);
          g.insert('path', ':first-child').datum(data).attr('fill',series.color).attr('opacity',.12).attr('d',area);
        }
      });
      if (config.eventDots) {
        g.selectAll('.event-dot').data(eventRows).join('circle').attr('class','event-dot')
          .attr('cx',d=>x(d.x)).attr('cy',d=>config.eventY ? y(config.eventY(d)) : innerH).attr('r',3);
      }
      const overlay = g.append('rect').attr('class','hit').attr('data-chart-hit','true').attr('data-chart-hover-overlay','cross-series')
        .attr('width',innerW).attr('height',innerH);
      const guide = g.append('line').attr('stroke','var(--muted-foreground)').attr('opacity',.45).attr('y1',0).attr('y2',innerH).style('display','none');
      overlay.on('pointermove pointerenter', (event) => {
        const [mx] = d3.pointer(event, overlay.node());
        const date = x.invert(mx);
        const index = d3.bisector(d=>d.x).center(data, date);
        const row = data[Math.max(0, Math.min(data.length-1,index))];
        guide.style('display', null).attr('x1',x(row.x)).attr('x2',x(row.x));
        tooltip.style.display='block';
        tooltip.style.left=`${Math.min(width-170, Math.max(8, event.offsetX+12))}px`;
        tooltip.style.top=`${Math.max(4, event.offsetY-12)}px`;
        tooltip.innerHTML = `<strong>${row.d}</strong><br>${config.tooltip(row)}`;
      }).on('pointerleave', () => { guide.style('display','none'); tooltip.style.display='none'; });
    }
