[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-mesh"
version = "0.1.0"
description = "Auditable BTC perpetual grid research with NanoJev event gates"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "requests", "numba", "scipy"]

[project.optional-dependencies]
model = ["torch", "transformers", "safetensors", "huggingface_hub"]
test = ["pytest"]
report = ["matplotlib", "markdown"]

[project.scripts]
jev-mesh = "jevmesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
